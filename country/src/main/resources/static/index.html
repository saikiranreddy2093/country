<!DOCTYPE html>
<html>
<head>
    <title>Country State City Dropdown promises</title>

    <style>

        body
        {
            font-family: Arial;
            margin: 50px;
        }

        select
        {
            width: 250px;
            height: 35px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        label
        {
            font-weight: bold;
        }

    </style>

</head>

<body>

<h2>Country State City Dropdown promises</h2>

<label>Country:</label><br>
<select id="countries"></select>

<br>

<label>State:</label><br>
<select id="states"></select>

<br>

<label>City:</label><br>
<select id="cities"></select>

<script>

    const countryDropdown = document.getElementById("countries");
    const stateDropdown = document.getElementById("states");
    const cityDropdown = document.getElementById("cities");

    function loadData(url, dropdown)
    {
        return new Promise(function(resolve, reject)
        {
            var httprequest = new XMLHttpRequest();

            httprequest.open("GET", url);

            httprequest.onload = function()
            {

                    const data = JSON.parse(httprequest.responseText);

                    dropdown.innerHTML = "";

                    data.forEach(item =>
                    {
                        let option = document.createElement("option");

                        option.value = item;
                        option.text = item;

                        dropdown.appendChild(option);
                    });

                    resolve(data[0]); // return first value

            };

           /* httprequest.onerror = function()
            {
                reject("Network Error");
            };*/

            httprequest.send();
        });
    }

    // Page Load
    window.onload = function()
    {
        loadData(
            "http://localhost:8080/getCountries",
            countryDropdown
        )

        .then(country =>
        {
            return loadData(
                `http://localhost:8080/getStates?country=${country}`,
                stateDropdown
            );
        })

        .then(state =>
        {
            return loadData(
                `http://localhost:8080/getCities?state=${state}`,
                cityDropdown
            );
        })

        .then(city =>
        {
            console.log("First City:", city);
        })

        .catch(error =>
        {
            console.log(error);
        });
    };

</script>

</body>
</html>
